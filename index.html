<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de Dados</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --felt-dark: #163d2e;
    --felt: #1e5a42;
    --felt-light: #2a7355;
    --cream: #f3ede0;
    --cream-dark: #e2d9c2;
    --pip: #26231d;
    --brass: #c9a24a;
    --brass-light: #e0c274;
    --die-size: 88px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 0%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    font-family: 'Manrope', sans-serif;
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 46px);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    text-align: center;
  }

  .subtitle {
    opacity: 0.65;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 36px;
    text-align: center;
  }

  .tray {
    background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.05));
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    box-shadow: inset 0 4px 24px rgba(0,0,0,0.35), 0 20px 40px rgba(0,0,0,0.3);
    padding: 50px 32px;
    width: 100%;
    max-width: 640px;
    min-height: 180px;
    display: flex;
    flex-wrap: wrap;
    gap: 34px;
    align-items: center;
    justify-content: center;
  }

  /* 3D die */
  .die3d {
    width: var(--die-size);
    height: var(--die-size);
    perspective: 500px;
  }

  .cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.05s cubic-bezier(.2,.9,.25,1);
  }

  .face {
    position: absolute;
    width: var(--die-size);
    height: var(--die-size);
    left: 0; top: 0;
    background: linear-gradient(145deg, var(--cream), var(--cream-dark));
    border-radius: 15px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(0,0,0,0.06);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 13px;
    backface-visibility: hidden;
  }

  .pip { display: flex; align-items: center; justify-content: center; }
  .pip.active::after {
    content: "";
    width: 62%;
    height: 62%;
    border-radius: 50%;
    background: var(--pip);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.15);
  }

  .p-tl { grid-area: 1 / 1; } .p-tc { grid-area: 1 / 2; } .p-tr { grid-area: 1 / 3; }
  .p-ml { grid-area: 2 / 1; } .p-mc { grid-area: 2 / 2; } .p-mr { grid-area: 2 / 3; }
  .p-bl { grid-area: 3 / 1; } .p-bc { grid-area: 3 / 2; } .p-br { grid-area: 3 / 3; }

  /* Face placements: opposite faces sum to 7, as on a real die */
  .face-1 { transform: translateZ(calc(var(--die-size) / 2)); }
  .face-6 { transform: rotateY(180deg) translateZ(calc(var(--die-size) / 2)); }
  .face-3 { transform: rotateY(90deg) translateZ(calc(var(--die-size) / 2)); }
  .face-4 { transform: rotateY(-90deg) translateZ(calc(var(--die-size) / 2)); }
  .face-2 { transform: rotateX(90deg) translateZ(calc(var(--die-size) / 2)); }
  .face-5 { transform: rotateX(-90deg) translateZ(calc(var(--die-size) / 2)); }

  .controls {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 640px;
  }

  .stepper {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0,0,0,0.2);
    border-radius: 100px;
    padding: 8px 10px;
  }

  .stepper button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--brass);
    color: var(--felt-dark);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .stepper button:hover:not(:disabled) { background: var(--brass-light); transform: scale(1.08); }
  .stepper button:disabled { opacity: 0.3; cursor: not-allowed; }
  .stepper button:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }

  .stepper .count {
    font-weight: 800;
    font-size: 16px;
    min-width: 90px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }

  .switch {
    width: 44px;
    height: 24px;
    border-radius: 100px;
    background: rgba(0,0,0,0.3);
    position: relative;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--cream);
    transition: transform 0.15s ease;
  }
  .toggle-wrap.on .switch { background: var(--brass); }
  .toggle-wrap.on .switch::after { transform: translateX(20px); }

  .roll-btn {
    margin-top: 30px;
    background: linear-gradient(180deg, var(--brass-light), var(--brass));
    border: none;
    color: var(--felt-dark);
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 22px;
    padding: 16px 52px;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 0 6px 0 #96762a, 0 10px 20px rgba(0,0,0,0.35);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .roll-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #96762a, 0 4px 10px rgba(0,0,0,0.3);
  }

  .result {
    margin-top: 22px;
    min-height: 34px;
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.01em;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .result.show { opacity: 1; transform: translateY(0); }
  .result .value { color: var(--brass-light); }

  @media (prefers-reduced-motion: reduce) {
    .cube { transition: none; }
  }
</style>
</head>
<body>

  <h1>Mesa de Dados</h1>
  <div class="subtitle">Lanza, agrega dados, suma si querés</div>

  <div class="tray" id="tray"></div>

  <div class="controls">
    <div class="stepper">
      <button id="minus" aria-label="Quitar un dado">−</button>
      <div class="count" id="count">2 dados</div>
      <button id="plus" aria-label="Agregar un dado">+</button>
    </div>

    <div class="toggle-wrap" id="sumToggle" role="switch" aria-checked="false" tabindex="0">
      <div class="switch"></div>
      <span>Mostrar suma</span>
    </div>
  </div>

  <button class="roll-btn" id="rollBtn">Lanzar</button>

  <div class="result" id="result"></div>

<script>
  const PIP_LAYOUTS = {
    1: ['mc'],
    2: ['tl','br'],
    3: ['tl','mc','br'],
    4: ['tl','tr','bl','br'],
    5: ['tl','tr','mc','bl','br'],
    6: ['tl','tr','ml','mr','bl','br'],
  };

  // Rotation (deg) needed to bring each face value to the front, facing the viewer.
  const FACE_TARGET = {
    1: { x: 0,   y: 0   },
    6: { x: 0,   y: 180 },
    3: { x: 0,   y: -90 },
    4: { x: 0,   y: 90  },
    2: { x: -90, y: 0   },
    5: { x: 90,  y: 0   },
  };

  const tray = document.getElementById('tray');
  const countLabel = document.getElementById('count');
  const minusBtn = document.getElementById('minus');
  const plusBtn = document.getElementById('plus');
  const rollBtn = document.getElementById('rollBtn');
  const sumToggle = document.getElementById('sumToggle');
  const resultEl = document.getElementById('result');

  const MIN_DICE = 1;
  const MAX_DICE = 5;
  let diceCount = 2;
  let showSum = false;

  // Each die: { cubeEl, value, rotX, rotY }
  let dice = [];

  function buildFacePips(value) {
    const active = PIP_LAYOUTS[value];
    let html = '';
    ['tl','tc','tr','ml','mc','mr','bl','bc','br'].forEach(pos => {
      html += `<div class="pip p-${pos}${active.includes(pos) ? ' active' : ''}"></div>`;
    });
    return html;
  }

  function buildDie() {
    const wrap = document.createElement('div');
    wrap.className = 'die3d';
    const cube = document.createElement('div');
    cube.className = 'cube';
    for (let v = 1; v <= 6; v++) {
      const face = document.createElement('div');
      face.className = `face face-${v}`;
      face.innerHTML = buildFacePips(v);
      cube.appendChild(face);
    }
    wrap.appendChild(cube);
    tray.appendChild(wrap);
    return { cubeEl: cube, value: 1, rotX: 0, rotY: 0 };
  }

  function initDice() {
    tray.innerHTML = '';
    dice = [];
    for (let i = 0; i < diceCount; i++) {
      dice.push(buildDie());
    }
  }

  function addDie() {
    dice.push(buildDie());
  }

  function removeDie() {
    const last = dice.pop();
    if (last) last.cubeEl.parentElement.remove();
  }

  function updateCountLabel() {
    countLabel.textContent = `${diceCount} dado${diceCount > 1 ? 's' : ''}`;
    minusBtn.disabled = diceCount <= MIN_DICE;
    plusBtn.disabled = diceCount >= MAX_DICE;
  }

  function updateResult() {
    if (!showSum) {
      resultEl.classList.remove('show');
      return;
    }
    const sum = dice.reduce((a, d) => a + d.value, 0);
    resultEl.innerHTML = `Suma total: <span class="value">${sum}</span>`;
    resultEl.classList.add('show');
  }

  function mod360(n) {
    return ((n % 360) + 360) % 360;
  }

  function nextRotation(current, targetMod) {
    const spins = 2 + Math.floor(Math.random() * 2); // 2-3 extra full turns
    const currentMod = mod360(current);
    const diff = mod360(targetMod - currentMod);
    return current + spins * 360 + diff;
  }

  function roll() {
    dice.forEach(die => {
      const value = 1 + Math.floor(Math.random() * 6);
      const target = FACE_TARGET[value];
      die.rotX = nextRotation(die.rotX, target.x);
      die.rotY = nextRotation(die.rotY, target.y);
      die.value = value;
      die.cubeEl.style.transform = `rotateX(${die.rotX}deg) rotateY(${die.rotY}deg)`;
    });
    setTimeout(updateResult, 950);
  }

  minusBtn.addEventListener('click', () => {
    if (diceCount > MIN_DICE) {
      diceCount--;
      removeDie();
      updateCountLabel();
      updateResult();
    }
  });

  plusBtn.addEventListener('click', () => {
    if (diceCount < MAX_DICE) {
      diceCount++;
      addDie();
      updateCountLabel();
      updateResult();
    }
  });

  function toggleSum() {
    showSum = !showSum;
    sumToggle.classList.toggle('on', showSum);
    sumToggle.setAttribute('aria-checked', showSum);
    updateResult();
  }

  sumToggle.addEventListener('click', toggleSum);
  sumToggle.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSum(); }
  });

  rollBtn.addEventListener('click', roll);

  // init
  updateCountLabel();
  initDice();
</script>

</body>
</html>
